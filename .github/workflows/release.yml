name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          for arch in amd64 arm64; do
            out="dist/blanca-${tag}-linux-${arch}"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${tag#v}" -o "$out/blanca" .
            cp -r assets LICENSE README.md "$out/"
            tar -C dist -czf "$out.tar.gz" "$(basename "$out")"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes || gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --clobber
  pacman:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Build pacman packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"; ver="${tag#v}"
          pacman -Syu --noconfirm github-cli git
          useradd -m builder
          cp packaging/aur/PKGBUILD /home/builder/PKGBUILD
          cd /home/builder
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/SHA256SUMS" -o SHA256SUMS
          a=$(grep amd64 SHA256SUMS | cut -d' ' -f1); b=$(grep arm64 SHA256SUMS | cut -d' ' -f1)
          sed -i "s/^pkgver=.*/pkgver=${ver}/; s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${a}')/; s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${b}')/" PKGBUILD
          sed 's/^CARCH=.*/CARCH="aarch64"/; s/^CHOST=.*/CHOST="aarch64-unknown-linux-gnu"/' /etc/makepkg.conf > makepkg-aarch64.conf
          chown -R builder .
          su builder -c "makepkg -fd --noconfirm"
          su builder -c "makepkg -fd --noconfirm --config makepkg-aarch64.conf"
          ls -l *.pkg.tar.zst
          gh release upload --repo "${GITHUB_REPOSITORY}" "${tag}" *.pkg.tar.zst --clobber
