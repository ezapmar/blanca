name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          for arch in amd64 arm64; do
            out="dist/blanca-${tag}-linux-${arch}"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${tag#v}" -o "$out/blanca" .
            cp -r assets LICENSE README.md "$out/"
            tar -C dist -czf "$out.tar.gz" "$(basename "$out")"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes || gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --clobber
  pacman:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Build pacman packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"; ver="${tag#v}"
          pacman -Syu --noconfirm github-cli git
          useradd -m builder
          cp packaging/aur/PKGBUILD /home/builder/PKGBUILD
          cd /home/builder
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/SHA256SUMS" -o SHA256SUMS
          a=$(grep amd64 SHA256SUMS | cut -d' ' -f1); b=$(grep arm64 SHA256SUMS | cut -d' ' -f1)
          sed -i "s/^pkgver=.*/pkgver=${ver}/; s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${a}')/; s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${b}')/" PKGBUILD
          sed 's/^CARCH=.*/CARCH="aarch64"/; s/^CHOST=.*/CHOST="aarch64-unknown-linux-gnu"/' /etc/makepkg.conf > makepkg-aarch64.conf
          chown -R builder .
          su builder -c "makepkg -fd --noconfirm"
          su builder -c "makepkg -fd --noconfirm --config makepkg-aarch64.conf"
          for arch in x86_64 aarch64; do # fixed names too: the site's download links never change
            cp "blanca-bin-${ver}-1-${arch}.pkg.tar.zst" "blanca-${arch}.pkg.tar.zst"
          done
          ls -l *.pkg.tar.zst
          gh release upload --repo "${GITHUB_REPOSITORY}" "${tag}" *.pkg.tar.zst --clobber
  macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # With the signing secrets set, the app and the dmg come out signed with the
      # Developer ID and notarised. Without them (a fork, say) the build is ad hoc.
      - name: Signing identity
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -eu
          [ -n "$MACOS_CERT_P12" ] || { echo "No signing secrets, building ad hoc"; exit 0; }
          kc="$RUNNER_TEMP/blanca.keychain-db"; pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          for ca in DeveloperIDCA DeveloperIDG2CA; do # the intermediates a .p12 leaves out
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$kc" || true
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc"
          security default-keychain -s "$kc"
          sha=$(security find-identity -v -p codesigning "$kc" | awk '/Developer ID Application/ {print $2; exit}')
          [ -n "$sha" ] || { echo "No Developer ID Application identity in MACOS_CERT_P12" >&2; exit 1; }
          xcrun notarytool store-credentials blanca-notary --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
          echo "BLANCA_SIGN=$sha" >> "$GITHUB_ENV"
          echo "BLANCA_NOTARY=blanca-notary" >> "$GITHUB_ENV"
      - name: Build universal binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          out="dist/blanca-${tag}-darwin-universal"
          mkdir -p "$out"
          scripts/macapp "${tag#v}"
          cp dist/Blanca.app/Contents/MacOS/blanca "$out/blanca"
          if [ -n "${BLANCA_SIGN:-}" ]; then
            codesign --force --options runtime --timestamp --sign "$BLANCA_SIGN" "$out/blanca"
          else
            codesign --force --sign - "$out/blanca"
          fi
          cp LICENSE README.md "$out/"
          tar -C dist -czf "$out.tar.gz" "$(basename "$out")"
          ditto -c -k --keepParent dist/Blanca.app "dist/Blanca-${tag}.zip"
          (cd dist && shasum -a 256 "$(basename "$out").tar.gz" > "$(basename "$out").tar.gz.sha256")
          cp dist/Blanca.dmg "dist/Blanca-${tag}.dmg" # Blanca.dmg too: the site's download link never changes
          gh release upload "$tag" "$out.tar.gz" "$out.tar.gz.sha256" "dist/Blanca-${tag}.zip" "dist/Blanca-${tag}.dmg" dist/Blanca.dmg --clobber
