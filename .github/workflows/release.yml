name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          for arch in amd64 arm64; do
            out="dist/blanca-${tag}-linux-${arch}"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${tag#v}" -o "$out/blanca" .
            cp -r assets LICENSE README.md "$out/"
            tar -C dist -czf "$out.tar.gz" "$(basename "$out")"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
